name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test -v ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o constelfs-server-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/server
          go build -o constelfs-node-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/node
          go build -o constelfs-client-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/client

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: constelfs-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            constelfs-server-*
            constelfs-node-*
            constelfs-client-*
